name: npm-build-app

# Reusable workflow for npm app repos (sites and the like).
#
#   build       npm-build: npm ci, format:check, lint, test (when present), build with build-env
#   dependabot  merge / update-behind (dependabot.yml)
#
# Caller shape:
#
#   permissions:
#     contents: read
#     pull-requests: read
#   jobs:
#     pipeline:                 # keep the id: the required check is `pipeline / build`
#       uses: ccswe-apps/actions/.github/workflows/npm-build-app.yml@master
#       with:
#         build-env: |
#           SITE=https://staging.example.com
#       secrets:
#         AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
#         AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
#
# Package contract: scripts `format:check`, `lint` and `build`; `test` is optional;
# the Node version comes from `node-version-file` (default .nvmrc).

on:
  workflow_call:
    inputs:
      build-env:
        description: KEY=value lines exported for `npm run build`.
        type: string
        default: ''
      node-version-file:
        type: string
        default: .nvmrc
      timeout-minutes:
        type: number
        default: 15
    secrets:
      AUTOMATION_APP_ID:
        required: true
      AUTOMATION_APP_KEY:
        required: true

jobs:
  # No `name:`, so the check is `<caller job> / build`.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/npm-build
        with:
          node-version-file: ${{ inputs.node-version-file }}
          build-env: ${{ inputs.build-env }}

  dependabot:
    needs: build
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/dependabot.yml
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
