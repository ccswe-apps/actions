name: test

# Self-tests: lint every workflow and composite script, and run the composites
# against the fixtures under test/fixtures/. The job ids are required checks
# (repo ruleset); keep them without a `name:`.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:   # re-run master's checks for the release gate

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # sha256 from the release's checksums.txt.
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm actionlint "$archive"

      # actionlint doesn't know the `$/` self-repository syntax yet.
      - name: Lint
        run: |
          actionlint \
            -ignore 'specifying action "\$/[^"]*" in invalid format because ref is missing' \
            -ignore 'reusable workflow call "\$/[^"]*" at "uses" is not following the format'

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - run: shellcheck .github/actions/*/*.sh

  fixture-gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/gradle-build
        with:
          working-directory: test/fixtures/gradle
          java-version: '21'
          tasks: build
          gradle-properties: |
            org.gradle.workers.max=2

      - name: Assert
        run: |
          grep -qx 'org.gradle.workers.max=2' "$HOME/.gradle/gradle.properties" || { echo "::error::gradle-properties not appended"; exit 1; }
          [ -f test/fixtures/gradle/build/libs/fixture.jar ] || { echo "::error::fixture.jar not built"; exit 1; }

  fixture-dotnet-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The default test-patterns skip Pass.IntegrationTests, which always fails.
      - id: build
        uses: $/.github/actions/dotnet-build
        with:
          path: test/fixtures/dotnet/pass/src
          artifact-name: fixture-pass-results
          report-name: fixture-pass-tests

      - name: Assert
        env:
          VERSION: ${{ steps.build.outputs.version }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          if [ -z "$VERSION" ] || [ -z "$PACKAGE_VERSION" ]; then
            echo "::error::empty version outputs"
            exit 1
          fi
          actual="$(find "$RUNNER_TEMP/TestResults" -name '*.trx' -printf '%f ' | xargs -n1 | sort | xargs)"
          [ "$actual" = "Pass.UnitTests.trx" ] || { echo "::error::unexpected TRX files: $actual"; exit 1; }

  fixture-dotnet-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: build
        continue-on-error: true
        uses: $/.github/actions/dotnet-build
        with:
          path: test/fixtures/dotnet/fail/src
          test-patterns: '*.UnitTests.csproj *.IntegrationTests.csproj'
          artifact-name: fixture-fail-results
          report-name: ''

      # The failing project runs first; the passing one must still run.
      - name: Assert
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::expected failure, got $OUTCOME"; exit 1; }
          actual="$(find "$RUNNER_TEMP/TestResults" -name '*.trx' -printf '%f ' | xargs -n1 | sort | xargs)"
          [ "$actual" = "Fail.IntegrationTests.trx Fail.UnitTests.trx" ] || { echo "::error::unexpected TRX files: $actual"; exit 1; }

  fixture-dotnet-no-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: $/.github/actions/dotnet-build
        with:
          path: test/fixtures/dotnet/no-tests/src
          artifact-name: fixture-no-tests-results
          report-name: fixture-no-tests-tests

      - name: Assert
        run: |
          [ ! -e "$RUNNER_TEMP/TestResults" ] || { echo "::error::tests ran with no test projects"; exit 1; }

  fixture-dotnet-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: build
        uses: $/.github/actions/dotnet-build
        with:
          path: test/fixtures/dotnet/library/src
          artifact-name: fixture-library-results
          report-name: ''

      - id: pack
        uses: $/.github/actions/dotnet-pack
        with:
          path: test/fixtures/dotnet/library/src
          version: ${{ steps.build.outputs.package-version }}

      - name: Assert
        env:
          PACKAGES: ${{ steps.pack.outputs.packages }}
          DIRECTORY: ${{ steps.pack.outputs.directory }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          [ "$PACKAGES" = '["Fixture.Library"]' ] || { echo "::error::unexpected packages: $PACKAGES"; exit 1; }
          [ -f "$DIRECTORY/Fixture.Library.$PACKAGE_VERSION.nupkg" ] || { echo "::error::package missing"; exit 1; }
          [ -f "$DIRECTORY/Fixture.Library.$PACKAGE_VERSION.snupkg" ] || { echo "::error::symbol package missing"; exit 1; }
          # The LocalOnly test is filtered out: only Runs executes.
          grep -q '<Counters total="1" executed="1" passed="1" failed="0"' "$RUNNER_TEMP/TestResults/Library.UnitTests.trx" ||
            { echo "::error::LocalOnly filter: unexpected counters"; grep -o '<Counters[^>]*>' "$RUNNER_TEMP/TestResults/Library.UnitTests.trx"; exit 1; }

  fixture-dotnet-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - id: minor
        uses: $/.github/actions/update-package-versions
        with:
          packages: nunit Microsoft.NET.Test.Sdk
          version: 5.0.1

      - name: Assert minor
        env:
          CHANGED: ${{ steps.minor.outputs.changed }}
          MAJOR: ${{ steps.minor.outputs.major }}
        run: |
          if [ "$CHANGED" != true ] || [ "$MAJOR" != true ]; then
            echo "::error::changed=$CHANGED major=$MAJOR (Test.Sdk 18 -> 5 is a major change)"
            exit 1
          fi
          grep -q '<PackageVersion Include="NUnit" Version="5.0.1" />' test/fixtures/dotnet/Directory.Packages.props
          git checkout -- .

      - id: patch
        uses: $/.github/actions/update-package-versions
        with:
          packages: NUnit
          version: 5.0.1

      - name: Assert patch
        env:
          CHANGED: ${{ steps.patch.outputs.changed }}
          MAJOR: ${{ steps.patch.outputs.major }}
          SUMMARY: ${{ steps.patch.outputs.summary }}
        run: |
          if [ "$CHANGED" != true ] || [ "$MAJOR" != false ]; then
            echo "::error::changed=$CHANGED major=$MAJOR"
            exit 1
          fi
          [ "$SUMMARY" = "Bumps NUnit from 5.0.0 to 5.0.1" ] || { echo "::error::summary: $SUMMARY"; exit 1; }
          git checkout -- .

      - id: unknown
        uses: $/.github/actions/update-package-versions
        with:
          packages: Unknown.Package
          version: 1.0.0

      - name: Assert unknown
        env:
          CHANGED: ${{ steps.unknown.outputs.changed }}
        run: |
          [ "$CHANGED" = false ] || { echo "::error::changed=$CHANGED"; exit 1; }
          git diff --exit-code

      - id: invalid
        continue-on-error: true
        uses: $/.github/actions/update-package-versions
        with:
          packages: NUnit
          version: '5.0'

      - name: Assert invalid
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::expected failure, got $OUTCOME"; exit 1; }

  fixture-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OWNER: fixture
      EXCLUDE: fixture/excluded
    steps:
      - uses: actions/checkout@v7

      - name: Discover (local)
        id: discover
        env:
          UPDATER: ccswe-apps/actions/.github/workflows/dotnet-update-dependencies.yml
        run: python3 .github/actions/discover-dependents/discover-dependents.py --local test/fixtures/listeners

      - name: Assert
        env:
          REPOS: ${{ steps.discover.outputs.repos }}
        run: |
          [ "$REPOS" = '["fixture/dotnet-app", "fixture/renamed"]' ] || { echo "::error::unexpected repos: $REPOS"; exit 1; }

      # ONLY: bare and qualified names, other owners ignored, unknown names warn, empty keeps none.
      - name: Assert filtered
        env:
          UPDATER: ccswe-apps/actions/.github/workflows/dotnet-update-dependencies.yml
        run: |
          discover() {
            ONLY="$1" python3 .github/actions/discover-dependents/discover-dependents.py --local test/fixtures/listeners | tee /dev/stderr
          }
          check() {
            local out="$1" expected="$2"
            grep -qxF "repos=$expected" <<< "$out" || { echo "::error::expected repos=$expected"; exit 1; }
          }
          out="$(discover 'RENAMED, other/dotnet-app')"
          check "$out" '["fixture/renamed"]'
          grep -qxF -- '- fixture/dotnet-app: listener dotnet-app/.github/workflows/update-dependencies.yml (not opted in)' <<< "$out" ||
            { echo "::error::dotnet-app not logged as skipped"; exit 1; }
          out="$(discover 'fixture/dotnet-app typo')"
          check "$out" '["fixture/dotnet-app"]'
          grep -qF '::warning::Update-Dependents: fixture/typo is not an update-dependencies listener' <<< "$out" ||
            { echo "::error::no warning for typo"; exit 1; }
          check "$(discover '')" '[]'
          check "$(discover '*')" '["fixture/dotnet-app", "fixture/renamed"]'

      - name: Discover Android (local)
        id: android
        env:
          UPDATER: ccswe-apps/actions/.github/workflows/android-update-dependencies.yml
        run: python3 .github/actions/discover-dependents/discover-dependents.py --local test/fixtures/listeners

      - name: Assert Android
        env:
          REPOS: ${{ steps.android.outputs.repos }}
        run: |
          [ "$REPOS" = '["fixture/android-app"]' ] || { echo "::error::unexpected repos: $REPOS"; exit 1; }

      # dependents-plan: owners grouped case-insensitively, invalid entries fail.
      - name: Assert plan
        run: |
          plan() {
            DEPENDENTS="$1" DISCOVER="$2" ONLY="$3" python3 .github/actions/dependents-plan/dependents-plan.py
          }
          out="$(plan $'Fixture/app\nother/lib' $'fixture\nscan' 'fixture/app other/lib')"
          expected='owners=[{"owner":"Fixture","discover":true,"repos":["Fixture/app"]},{"owner":"other","discover":false,"repos":["other/lib"]},{"owner":"scan","discover":true,"repos":[]}]'
          grep -qxF "$expected" <<< "$out" || { echo "::error::unexpected plan: $out"; exit 1; }
          grep -qxF '::warning::Update-Dependents: other/lib is not in a scanned account' <<< "$out" ||
            { echo "::error::no warning for other/lib"; exit 1; }
          [ "$(plan '' '' '*')" = $'only: *\nowners=[]' ] || { echo "::error::empty plan"; exit 1; }
          if plan 'bad' '' '*'; then echo "::error::invalid dependents entry accepted"; exit 1; fi
          if plan '' 'bad/owner' '*'; then echo "::error::invalid discover-dependents entry accepted"; exit 1; fi

      # Update-Dependents parsing from a pull_request body.
      - name: Assert opt-in
        env:
          EVENT_NAME: pull_request
        run: |
          check() {
            local body="$1" expected="$2" actual
            actual="$(PR_BODY="$body" python3 .github/actions/dependents-opt-in/dependents-opt-in.py | tail -n 1)"
            [ "$actual" = "only=$expected" ] || { echo "::error::body ${body@Q}: got $actual, expected only=$expected"; exit 1; }
          }
          check $'Fixes x.\r\n\r\nUpdate-Dependents: rollout-web, midworld-apps/shelver-web\r\n' 'rollout-web midworld-apps/shelver-web'
          check $'<!-- Update-Dependents: rollout-web | all -->\nbody' ''
          check $'<!--\nUpdate-Dependents: all\n-->\nupdate-dependents: rollout-web\nUpdate-Dependents:  shelver-web  rollout-web' 'rollout-web shelver-web'
          check $'Update-Dependents: rollout-web, ALL' '*'
          check '' ''
          check $'Update-Dependents: bad|name, ok' 'ok'
          check 'see Update-Dependents: rollout-web' ''
          check $'Update-Dependents: typo-app' 'typo-app'

  fixture-android-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CATALOG: test/fixtures/catalog/libs.versions.toml
    steps:
      - uses: actions/checkout@v7

      # 0.x minor: breaking.
      - id: minor
        uses: $/.github/actions/update-catalog-versions
        with:
          packages: com.ccswe.android:core com.ccswe.android:app
          version: 0.8.0
          catalog: test/fixtures/catalog/libs.versions.toml

      - name: Assert minor
        env:
          CHANGED: ${{ steps.minor.outputs.changed }}
          BREAKING: ${{ steps.minor.outputs.breaking }}
          SUMMARY: ${{ steps.minor.outputs.summary }}
        run: |
          if [ "$CHANGED" != true ] || [ "$BREAKING" != true ]; then
            echo "::error::changed=$CHANGED breaking=$BREAKING (0.7 -> 0.8 is breaking)"
            exit 1
          fi
          [ "$SUMMARY" = $'Bumps com.ccswe.android:app from 0.7.0 to 0.8.0\nBumps com.ccswe.android:core from 0.7.0 to 0.8.0' ] ||
            { echo "::error::summary: $SUMMARY"; exit 1; }
          [ "$(git diff -U0 -- "$CATALOG" | grep -c '^[-+][^-+]')" = 2 ] || { echo "::error::more than the ccswe key changed"; git diff; exit 1; }
          grep -qx 'ccswe = "0.8.0"' "$CATALOG"
          git checkout -- .

      - id: patch
        uses: $/.github/actions/update-catalog-versions
        with:
          packages: com.ccswe.android:core
          version: 0.7.1
          catalog: test/fixtures/catalog/libs.versions.toml

      - name: Assert patch
        env:
          CHANGED: ${{ steps.patch.outputs.changed }}
          BREAKING: ${{ steps.patch.outputs.breaking }}
        run: |
          if [ "$CHANGED" != true ] || [ "$BREAKING" != false ]; then
            echo "::error::changed=$CHANGED breaking=$BREAKING"
            exit 1
          fi
          grep -qx 'ccswe = "0.7.1"' "$CATALOG"
          git checkout -- .

      # version = { ref = ... }, a 1.x minor (not breaking), and a trailing comment.
      - id: stable
        uses: $/.github/actions/update-catalog-versions
        with:
          packages: com.example:stable
          version: 1.5.0
          catalog: test/fixtures/catalog/libs.versions.toml

      - name: Assert stable
        env:
          CHANGED: ${{ steps.stable.outputs.changed }}
          BREAKING: ${{ steps.stable.outputs.breaking }}
        run: |
          if [ "$CHANGED" != true ] || [ "$BREAKING" != false ]; then
            echo "::error::changed=$CHANGED breaking=$BREAKING"
            exit 1
          fi
          grep -qx 'stable = "1.5.0" # comment' "$CATALOG"
          git checkout -- .

      # Inline versions: table and "group:name:version" notation; a major change.
      - id: inline
        uses: $/.github/actions/update-catalog-versions
        with:
          packages: com.example:inline com.example:string
          version: 3.0.0
          catalog: test/fixtures/catalog/libs.versions.toml

      - name: Assert inline
        env:
          CHANGED: ${{ steps.inline.outputs.changed }}
          BREAKING: ${{ steps.inline.outputs.breaking }}
        run: |
          if [ "$CHANGED" != true ] || [ "$BREAKING" != true ]; then
            echo "::error::changed=$CHANGED breaking=$BREAKING"
            exit 1
          fi
          grep -qF 'name = "inline", version = "3.0.0" }' "$CATALOG"
          grep -qx 'string-lib = "com.example:string:3.0.0"' "$CATALOG"
          git checkout -- .

      - id: unchanged
        uses: $/.github/actions/update-catalog-versions
        with:
          packages: com.ccswe.android:core com.unknown:library
          version: 0.7.0
          catalog: test/fixtures/catalog/libs.versions.toml

      - name: Assert unchanged
        env:
          CHANGED: ${{ steps.unchanged.outputs.changed }}
        run: |
          [ "$CHANGED" = false ] || { echo "::error::changed=$CHANGED"; exit 1; }
          git diff --exit-code

      - id: invalid
        continue-on-error: true
        uses: $/.github/actions/update-catalog-versions
        with:
          packages: core
          version: 1.0.0
          catalog: test/fixtures/catalog/libs.versions.toml

      - name: Assert invalid
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::expected failure, got $OUTCOME"; exit 1; }

  fixture-npm-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/npm-build
        with:
          working-directory: test/fixtures/npm/app
          build-env: |
            SITE=https://staging.example.com

      - name: Assert
        working-directory: test/fixtures/npm/app
        run: |
          [ -f test-ran ] || { echo "::error::test script didn't run"; exit 1; }
          [ "$(cat site-url)" = https://staging.example.com ] || { echo "::error::build-env not exported"; exit 1; }

  fixture-npm-action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/npm-build
        with:
          working-directory: test/fixtures/npm/action
          committed-output: dist

  # A source change without a rebuilt dist/ must fail the committed-output check.
  fixture-npm-action-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read  # gh run download
      contents: read
    steps:
      - uses: actions/checkout@v7

      - run: echo "console.log('changed');" > test/fixtures/npm/action/src/index.js

      - id: build
        continue-on-error: true
        uses: $/.github/actions/npm-build
        with:
          working-directory: test/fixtures/npm/action
          committed-output: dist

      # The failure uploads the expected dist/ for contributors who can't get a rebuild pushed.
      # Fetch it the way the error message tells them to; the listing can lag the upload briefly.
      - name: Assert
        env:
          OUTCOME: ${{ steps.build.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::expected failure, got $OUTCOME"; exit 1; }
          dir="$RUNNER_TEMP/committed-output"
          for _ in 1 2 3 4 5 6; do
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n committed-output -D "$dir" && break
            sleep 5
          done
          grep -q changed "$dir/index.js" || { echo "::error::artifact lacks the rebuilt dist"; exit 1; }

  # android-play-publish --dry-run: phone and Wear tracks, a missing mapping warns, bad trees fail.
  fixture-android-play:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PACKAGE_NAME: com.example.fixture
      WEAR_MODULES: ':wear'
    steps:
      - uses: actions/checkout@v7

      - name: Assert
        run: |
          dir="$RUNNER_TEMP/play"
          mkdir -p "$dir/app" "$dir/wear"
          touch "$dir/app/app-release.aab" "$dir/app/mapping.txt" "$dir/wear/wear-release.aab"
          dry_run() {
            ARTIFACT_DIR="$dir" python3 .github/actions/android-play-publish/play_publish.py --dry-run
          }
          out="$(dry_run)"
          echo "$out"
          for line in \
            'app: app/app-release.aab, app/mapping.txt -> internal' \
            'wear: wear/wear-release.aab -> wear:internal' \
            '::warning::No mapping.txt for wear; Play gets no deobfuscation file' \
            'status: completed' \
            'in-app update priority: 0' \
            'dry run: no requests made'; do
            grep -qxF "$line" <<< "$out" || { echo "::error::missing line: $line"; exit 1; }
          done
          if RELEASE_STATUS=inProgress dry_run; then echo "::error::invalid release status accepted"; exit 1; fi
          UPDATE_PRIORITY=5 dry_run | grep -qxF 'in-app update priority: 5' || { echo "::error::priority 5 not passed"; exit 1; }
          if UPDATE_PRIORITY=6 dry_run; then echo "::error::priority 6 accepted"; exit 1; fi
          if WEAR_MODULES='wear watch' dry_run; then echo "::error::missing wear module accepted"; exit 1; fi
          touch "$dir/app/app-debug.aab"
          if dry_run; then echo "::error::two AABs in one module accepted"; exit 1; fi

  fixture-dotnet-sdk-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Generated global.json files (BOM, CRLF and comments survive no checkout normalization).
      - name: Assert
        run: |
          root="$RUNNER_TEMP/sdk"
          resolve() {
            local out="$RUNNER_TEMP/sdk-output"
            : > "$out"
            DOTNET_VERSION="$1" ROOT="$root" GITHUB_OUTPUT="$out" \
              python3 .github/actions/dotnet-sdk-version/dotnet-sdk-version.py >&2 || return 1
            sed -n '2p' "$out"
          }
          check() {
            local name="$1" json="$2" expected="$3" actual
            rm -rf "$root"; mkdir -p "$root"
            [ -z "$json" ] || printf '%b' "$json" > "$root/global.json"
            actual="$(resolve "${4:-}")" || { echo "::error::$name: resolve failed"; exit 1; }
            [ "$actual" = "$expected" ] || { echo "::error::$name: got ${actual@Q}, expected $expected"; exit 1; }
          }
          check 'no file' '' '10.0.x'
          check 'input wins' '{"sdk":{"version":"11.0.100"}}' '9.0.x' '9.0.x'
          check '10.0.0 latestMinor' '{"sdk":{"version":"10.0.0","rollForward":"latestMinor","allowPrerelease":false}}' '10.0.x'
          check '11.0.100 latestMinor' '{"sdk":{"version":"11.0.100","rollForward":"latestMinor"}}' '11.0.x'
          check 'latestFeature' '{"sdk":{"version":"10.0.204","rollForward":"latestFeature"}}' '10.0.x'
          check 'latestPatch' '{"sdk":{"version":"10.0.204","rollForward":"latestPatch"}}' '10.0.2xx'
          check 'no rollForward' '{"sdk":{"version":"10.0.115"}}' '10.0.1xx'
          check 'disable' '{"sdk":{"version":"10.0.115","rollForward":"disable"}}' '10.0.115'
          check 'prerelease' '{"sdk":{"version":"11.0.100-rc.2.25502.107","rollForward":"latestMajor","allowPrerelease":true}}' '11.0.100-rc.2.25502.107'
          # shellcheck disable=SC2016 # "$schema" is a literal JSON key
          check 'BOM CRLF comments' '\xef\xbb\xbf{\r\n  // pin\r\n  "$schema": "https://json.schemastore.org/global.json",\r\n  "sdk": { /* band */ "version": "11.0.100", "rollForward": "latestMinor", },\r\n}\r\n' '11.0.x'
          check 'msbuild-sdks only' '{"msbuild-sdks":{"Foo.Sdk":"1.0.0"}}' '10.0.x'
          rm -rf "$root"; mkdir -p "$root"
          multi="$(resolve $'8.0.x\n10.0.x')"
          [ "$multi" = '8.0.x' ] || { echo "::error::multi-line input: got ${multi@Q}"; exit 1; }
          grep -qx '10.0.x' "$RUNNER_TEMP/sdk-output" || { echo "::error::multi-line input truncated"; exit 1; }
          for bad in '{"sdk":{"version":"11.0.100",' '{"sdk":{"version":"eleven"}}' '{"sdk":{"version":"11.0.100","rollForward":"sideways"}}'; do
            printf '%s' "$bad" > "$root/global.json"
            if resolve '' > /dev/null; then echo "::error::accepted ${bad@Q}"; exit 1; fi
          done

  fixture-tailwind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Generated Dockerfiles (CRLF, quotes and indentation survive no checkout normalization).
      - name: Arrange
        run: |
          mk() { mkdir -p "$RUNNER_TEMP/tw/$1"; printf '%b' "$2" > "$RUNNER_TEMP/tw/$1/Dockerfile"; }
          mk lf 'ARG DOTNET_VERSION=11.0\nARG TAILWIND_VERSION=v4.3.3\nFROM scratch\nARG TAILWIND_VERSION\n'
          mk crlf 'ARG TAILWIND_VERSION=v4.3.3\r\nFROM scratch\r\n'
          mk quoted '  ARG TAILWIND_VERSION="4.3.3"\n'
          mk none 'ARG DOTNET_VERSION=11.0\nFROM scratch\n'
          mk invalid 'ARG TAILWIND_VERSION=latest\n'
          mkdir -p "$RUNNER_TEMP/tw/nodockerfile"

      - id: lf
        uses: $/.github/actions/setup-tailwind
        with:
          root: ${{ runner.temp }}/tw/lf

      - name: Assert installed
        run: |
          banner="$(NO_COLOR=1 tailwindcss --help 2>&1 | sed -E $'s/\x1b\\[[0-9;]*m//g' || true)"
          [[ "${banner%%$'\n'*}" == *"tailwindcss v4.3.3"* ]] || { echo "::error::tailwindcss not on PATH: $banner"; exit 1; }

      - uses: $/.github/actions/setup-tailwind
        with:
          root: ${{ runner.temp }}/tw/crlf

      - uses: $/.github/actions/setup-tailwind
        with:
          root: ${{ runner.temp }}/tw/quoted

      - uses: $/.github/actions/setup-tailwind
        with:
          root: ${{ runner.temp }}/tw/none

      - uses: $/.github/actions/setup-tailwind
        with:
          root: ${{ runner.temp }}/tw/nodockerfile

      - id: invalid
        continue-on-error: true
        uses: $/.github/actions/setup-tailwind
        with:
          root: ${{ runner.temp }}/tw/invalid

      - name: Assert invalid failed
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::invalid ARG TAILWIND_VERSION accepted"; exit 1; }

  fixture-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: next-release-version
        run: |
          script="$GITHUB_WORKSPACE/.github/actions/next-release-version/next-release-version.sh"
          repo="$RUNNER_TEMP/release-repo"
          rm -rf "$repo"; mkdir -p "$repo"; cd "$repo"
          git init -q; git config user.email t@example.com; git config user.name t
          commit() { git commit -q --allow-empty -m "$1"; }
          next() {
            local out="$RUNNER_TEMP/next-output"
            : > "$out"
            BUMP="$1" GITHUB_OUTPUT="$out" "$script" >&2 || return 1
            tr '\n' ' ' < "$out" | sed 's/ $//'
          }
          check() {
            local actual
            actual="$(next "$1")" || { echo "::error::$1: failed"; exit 1; }
            [ "$actual" = "$2" ] || { echo "::error::$1: got ${actual@Q}, expected ${2@Q}"; exit 1; }
          }
          fails() {
            if next "$1" > /dev/null 2>&1; then echo "::error::$2 accepted"; exit 1; fi
          }
          commit first
          check major 'version=v1.0.0 major=v1 previous='
          fails preview 'invalid bump'
          git tag v1.2.3; commit second
          git tag v1.10.0-rc.1; git tag v2.0.0-rc.1; git tag v0-ruleset-probe; git tag v1
          check patch 'version=v1.2.4 major=v1 previous=v1.2.3'
          check minor 'version=v1.3.0 major=v1 previous=v1.2.3'
          check major 'version=v2.0.0 major=v2 previous=v1.2.3'
          git tag v1.10.0 HEAD~1
          check patch 'version=v1.10.1 major=v1 previous=v1.10.0'
          git tag v1.10.1; git tag -f v1 > /dev/null
          fails patch 'already released HEAD'

      - name: required-checks
        run: |
          script="$GITHUB_WORKSPACE/.github/actions/required-checks/required-checks.sh"
          stub="$RUNNER_TEMP/gh-stub"; mkdir -p "$stub"
          # Fake gh: rules/branches -> $RULES, check-runs -> $RUNS (--jq applied like gh does).
          cat > "$stub/gh" <<'STUB'
          #!/usr/bin/env bash
          path="" filter="."
          while [ $# -gt 0 ]; do
            case "$1" in --jq) filter="$2"; shift 2 ;; api|--paginate) shift ;; *) path="$1"; shift ;; esac
          done
          case "$path" in
            */rules/branches/*) jq -c "$filter" <<< "$RULES" ;;
            */check-runs*) jq -c "$filter" <<< "$RUNS" ;;
            *) exit 1 ;;
          esac
          STUB
          chmod +x "$stub/gh"
          rules='[{"type":"required_status_checks","parameters":{"required_status_checks":[{"context":"build","integration_id":15368},{"context":"lint","integration_id":15368}]}},{"type":"deletion"}]'
          run() { jq -nc --argjson id "$1" --arg name "$2" --arg status "$3" --arg conclusion "$4" --argjson app "${5:-15368}" \
            '{id:$id,name:$name,status:$status,conclusion:(if $conclusion == "" then null else $conclusion end),app:{id:$app}}'; }
          gate() { RULES="$1" RUNS="{\"check_runs\":[$2]}" PATH="$stub:$PATH" GH_TOKEN=x REPO=o/r BRANCH=master SHA=0123456789 "$script" >&2; }
          passes() { gate "$rules" "$2" || { echo "::error::$1: rejected"; exit 1; }; }
          fails() { if gate "${3:-$rules}" "$2"; then echo "::error::$1: accepted"; exit 1; fi; }
          passes 'all success' "$(run 1 build completed success),$(run 2 lint completed success)"
          passes 'skipped and neutral' "$(run 1 build completed skipped),$(run 2 lint completed neutral)"
          passes 'latest re-run wins' "$(run 1 build completed failure),$(run 3 build completed success),$(run 2 lint completed success)"
          fails 'missing check' "$(run 1 build completed success)"
          fails 'in progress' "$(run 1 build in_progress ''),$(run 2 lint completed success)"
          fails 'cancelled' "$(run 1 build completed cancelled),$(run 2 lint completed success)"
          fails 'stale success' "$(run 3 build completed failure),$(run 1 build completed success),$(run 2 lint completed success)"
          fails 'other app' "$(run 1 build completed success 999),$(run 2 lint completed success)"
          fails 'no required checks' "$(run 1 build completed success)" '[{"type":"deletion"}]'

  dependabot:
    needs: [actionlint, shellcheck, fixture-gradle, fixture-dotnet-pass, fixture-dotnet-fail, fixture-dotnet-no-tests, fixture-dotnet-library, fixture-dotnet-update, fixture-dotnet-sdk-version, fixture-tailwind, fixture-discover, fixture-android-update, fixture-android-play, fixture-npm-app, fixture-npm-action, fixture-npm-action-stale, fixture-release]
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/dependabot.yml
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
