name: test

# Self-tests: lint every workflow and composite script, and run the composites
# against the fixtures under test/fixtures/. The job ids are required checks
# (repo ruleset); keep them without a `name:`.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # sha256 from the release's checksums.txt.
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm actionlint "$archive"

      # actionlint doesn't know the `$/` self-repository syntax yet.
      - name: Lint
        run: |
          actionlint \
            -ignore 'specifying action "\$/[^"]*" in invalid format because ref is missing' \
            -ignore 'reusable workflow call "\$/[^"]*" at "uses" is not following the format'

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - run: shellcheck .github/actions/*/*.sh

  fixture-gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/gradle-build
        with:
          working-directory: test/fixtures/gradle
          java-version: '21'
          tasks: build
          gradle-properties: |
            org.gradle.workers.max=2

      - name: Assert
        run: |
          grep -qx 'org.gradle.workers.max=2' "$HOME/.gradle/gradle.properties" || { echo "::error::gradle-properties not appended"; exit 1; }
          [ -f test/fixtures/gradle/build/libs/fixture.jar ] || { echo "::error::fixture.jar not built"; exit 1; }

  fixture-dotnet-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The default test-patterns skip Pass.IntegrationTests, which always fails.
      - id: build
        uses: $/.github/actions/dotnet-build
        with:
          path: test/fixtures/dotnet/pass/src
          artifact-name: fixture-pass-results
          report-name: fixture-pass-tests

      - name: Assert
        env:
          VERSION: ${{ steps.build.outputs.version }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          if [ -z "$VERSION" ] || [ -z "$PACKAGE_VERSION" ]; then
            echo "::error::empty version outputs"
            exit 1
          fi
          actual="$(find "$RUNNER_TEMP/TestResults" -name '*.trx' -printf '%f ' | xargs -n1 | sort | xargs)"
          [ "$actual" = "Pass.UnitTests.trx" ] || { echo "::error::unexpected TRX files: $actual"; exit 1; }

  fixture-dotnet-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: build
        continue-on-error: true
        uses: $/.github/actions/dotnet-build
        with:
          path: test/fixtures/dotnet/fail/src
          test-patterns: '*.UnitTests.csproj *.IntegrationTests.csproj'
          artifact-name: fixture-fail-results
          report-name: ''

      # The failing project runs first; the passing one must still run.
      - name: Assert
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::expected failure, got $OUTCOME"; exit 1; }
          actual="$(find "$RUNNER_TEMP/TestResults" -name '*.trx' -printf '%f ' | xargs -n1 | sort | xargs)"
          [ "$actual" = "Fail.IntegrationTests.trx Fail.UnitTests.trx" ] || { echo "::error::unexpected TRX files: $actual"; exit 1; }

  fixture-dotnet-no-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: $/.github/actions/dotnet-build
        with:
          path: test/fixtures/dotnet/no-tests/src
          artifact-name: fixture-no-tests-results
          report-name: fixture-no-tests-tests

      - name: Assert
        run: |
          [ ! -e "$RUNNER_TEMP/TestResults" ] || { echo "::error::tests ran with no test projects"; exit 1; }

  fixture-dotnet-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: build
        uses: $/.github/actions/dotnet-build
        with:
          path: test/fixtures/dotnet/library/src
          artifact-name: fixture-library-results
          report-name: ''

      - id: pack
        uses: $/.github/actions/dotnet-pack
        with:
          path: test/fixtures/dotnet/library/src
          version: ${{ steps.build.outputs.package-version }}

      - name: Assert
        env:
          PACKAGES: ${{ steps.pack.outputs.packages }}
          DIRECTORY: ${{ steps.pack.outputs.directory }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          [ "$PACKAGES" = '["Fixture.Library"]' ] || { echo "::error::unexpected packages: $PACKAGES"; exit 1; }
          [ -f "$DIRECTORY/Fixture.Library.$PACKAGE_VERSION.nupkg" ] || { echo "::error::package missing"; exit 1; }
          [ -f "$DIRECTORY/Fixture.Library.$PACKAGE_VERSION.snupkg" ] || { echo "::error::symbol package missing"; exit 1; }

  fixture-dotnet-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - id: minor
        uses: $/.github/actions/update-package-versions
        with:
          packages: nunit Microsoft.NET.Test.Sdk
          version: 5.0.1

      - name: Assert minor
        env:
          CHANGED: ${{ steps.minor.outputs.changed }}
          MAJOR: ${{ steps.minor.outputs.major }}
        run: |
          if [ "$CHANGED" != true ] || [ "$MAJOR" != true ]; then
            echo "::error::changed=$CHANGED major=$MAJOR (Test.Sdk 18 -> 5 is a major change)"
            exit 1
          fi
          grep -q '<PackageVersion Include="NUnit" Version="5.0.1" />' test/fixtures/dotnet/Directory.Packages.props
          git checkout -- .

      - id: patch
        uses: $/.github/actions/update-package-versions
        with:
          packages: NUnit
          version: 5.0.1

      - name: Assert patch
        env:
          CHANGED: ${{ steps.patch.outputs.changed }}
          MAJOR: ${{ steps.patch.outputs.major }}
          SUMMARY: ${{ steps.patch.outputs.summary }}
        run: |
          if [ "$CHANGED" != true ] || [ "$MAJOR" != false ]; then
            echo "::error::changed=$CHANGED major=$MAJOR"
            exit 1
          fi
          [ "$SUMMARY" = "Bumps NUnit from 5.0.0 to 5.0.1" ] || { echo "::error::summary: $SUMMARY"; exit 1; }
          git checkout -- .

      - id: unknown
        uses: $/.github/actions/update-package-versions
        with:
          packages: Unknown.Package
          version: 1.0.0

      - name: Assert unknown
        env:
          CHANGED: ${{ steps.unknown.outputs.changed }}
        run: |
          [ "$CHANGED" = false ] || { echo "::error::changed=$CHANGED"; exit 1; }
          git diff --exit-code

      - id: invalid
        continue-on-error: true
        uses: $/.github/actions/update-package-versions
        with:
          packages: NUnit
          version: '5.0'

      - name: Assert invalid
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::expected failure, got $OUTCOME"; exit 1; }

  fixture-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Discover (local)
        id: discover
        env:
          OWNER: fixture
          UPDATER: ccswe-apps/actions/.github/workflows/dotnet-update-dependencies.yml
          EXCLUDE: fixture/excluded
        run: python3 .github/actions/discover-dependents/discover-dependents.py --local test/fixtures/listeners

      - name: Assert
        env:
          REPOS: ${{ steps.discover.outputs.repos }}
        run: |
          [ "$REPOS" = '["fixture/dotnet-app", "fixture/renamed"]' ] || { echo "::error::unexpected repos: $REPOS"; exit 1; }

  fixture-npm-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/npm-build
        with:
          working-directory: test/fixtures/npm/app
          build-env: |
            SITE=https://staging.example.com

      - name: Assert
        working-directory: test/fixtures/npm/app
        run: |
          [ -f test-ran ] || { echo "::error::test script didn't run"; exit 1; }
          [ "$(cat site-url)" = https://staging.example.com ] || { echo "::error::build-env not exported"; exit 1; }

  fixture-npm-action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/npm-build
        with:
          working-directory: test/fixtures/npm/action
          committed-output: dist

  # A source change without a rebuilt dist/ must fail the committed-output check.
  fixture-npm-action-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - run: echo "console.log('changed');" > test/fixtures/npm/action/src/index.js

      - id: build
        continue-on-error: true
        uses: $/.github/actions/npm-build
        with:
          working-directory: test/fixtures/npm/action
          committed-output: dist

      - name: Assert
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::expected failure, got $OUTCOME"; exit 1; }

  dependabot:
    needs: [actionlint, shellcheck, fixture-gradle, fixture-dotnet-pass, fixture-dotnet-fail, fixture-dotnet-no-tests, fixture-dotnet-library, fixture-dotnet-update, fixture-discover, fixture-npm-app, fixture-npm-action, fixture-npm-action-stale]
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/dependabot.yml
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
