name: dotnet-update-dependencies

# Reusable workflow for repos that consume a .NET library built with
# dotnet-build-library.yml: on the
# library's `update-dependencies` dispatch, set the dispatched packages to the
# published version, open a PR as andy-the-messenger-robot (so CI runs), close
# the PRs it supersedes, and auto-merge it unless a major version changed.
#
# Caller shape (.github/workflows/update-dependencies.yml):
#
#   on:
#     repository_dispatch:
#       types: [update-dependencies]
#   permissions:
#     contents: read
#   jobs:
#     update:
#       uses: ccswe-apps/actions/.github/workflows/dotnet-update-dependencies.yml@master
#       secrets:
#         AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
#         AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
#         PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}   # optional: private NuGet feed
#
# client_payload (sent by dotnet-build-library.yml):
#   {"source": "<owner>/<repo>", "version": "<semver>", "packages": ["<id>", ...]}
# Consumer contract: `path` (default src) holds the solution; versions live in
# Directory.Packages.props (CPM).

on:
  workflow_call:
    inputs:
      path:
        description: Directory holding the solution.
        type: string
        default: src
      dotnet-version:
        type: string
        default: '10.0.x'
    secrets:
      AUTOMATION_APP_ID:
        required: true
      AUTOMATION_APP_KEY:
        required: true
      PACKAGES_PAT:
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: update-dependencies-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Read payload
        id: payload
        env:
          SOURCE: ${{ github.event.client_payload.source }}
          VERSION: ${{ github.event.client_payload.version }}
          PACKAGES: ${{ toJSON(github.event.client_payload.packages) }}
        run: |
          if ! [[ "$SOURCE" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::invalid client_payload.source: $SOURCE"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid client_payload.version: $VERSION"
            exit 1
          fi
          if ! packages="$(jq -er 'select(type == "array" and length > 0 and all(.[]; type == "string" and test("^[A-Za-z0-9._-]+$"))) | join(" ")' <<< "$PACKAGES")"; then
            echo "::error::invalid client_payload.packages: $PACKAGES"
            exit 1
          fi
          {
            echo "source-name=${SOURCE#*/}"
            echo "version=$VERSION"
            echo "packages=$packages"
          } >> "$GITHUB_OUTPUT"

      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - id: update
        uses: $/.github/actions/update-package-versions
        with:
          packages: ${{ steps.payload.outputs.packages }}
          version: ${{ steps.payload.outputs.version }}

      - if: steps.update.outputs.changed == 'true'
        uses: $/.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # The package may not be listed yet; --no-http-cache lets a retry see it.
      - name: dotnet restore
        if: steps.update.outputs.changed == 'true'
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_PAT }}
          SOLUTION_PATH: ${{ inputs.path }}
        run: |
          for attempt in 1 2 3; do
            if dotnet restore "$SOLUTION_PATH" --no-http-cache; then
              exit 0
            fi
            echo "::warning::restore attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          SOURCE_NAME: ${{ steps.payload.outputs.source-name }}
          VERSION: ${{ steps.payload.outputs.version }}
          SUMMARY: ${{ steps.update.outputs.summary }}
          MAJOR: ${{ steps.update.outputs.major }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          prefix="bot/update-dependencies/${SOURCE_NAME}/"
          branch="${prefix}${RUN_ID}-${RUN_ATTEMPT}"
          title="Update ${SOURCE_NAME} packages to ${VERSION}"
          user_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title" -m "$SUMMARY"
          git push origin "$branch"
          url="$(gh pr create -R "$REPO" --base "$BASE" --head "$branch" --title "$title" --body "$SUMMARY")"
          number="${url##*/}"

          gh pr list -R "$REPO" --state open --limit 100 --json number,headRefName \
            -q ".[] | select(.headRefName | startswith(\"${prefix}\")) | select(.number != ${number}) | .number" |
            while read -r n; do
              gh pr close "$n" -R "$REPO" --delete-branch --comment "Superseded by #${number}."
            done

          if [ "$MAJOR" = true ]; then
            echo "::notice::#${number} changes a major version; not auto-merging"
          else
            gh pr merge "$number" -R "$REPO" --auto --squash
          fi
