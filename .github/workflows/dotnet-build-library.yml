name: dotnet-build-library

# Reusable workflow for .NET library repos published to GitHub Packages or nuget.org.
#
# Pipeline:
#   build       dependents-plan (the per-account `owners` for dependents), then
#               .github/actions/dotnet-build on `path` (unit and integration tests),
#               .github/actions/dotnet-pack, and dotnet-validate when validate-packages
#   publish     push the packages (and .snupkg) to nuget.org when NUGET_API_KEY is
#               passed, else nuget.pkg.github.com/<owner> (default-branch push that
#               changed something packable), then wait until the feed serves them
#   dependents  find dependents (`dependents` plus the listeners discovered in the
#               `discover-dependents` accounts); once the feed serves the
#               packages, send each `update-dependencies`. With `dispatch: opt-in`,
#               only the listeners the PR body names (`Update-Dependents:` lines,
#               dependents-opt-in); a push naming none skips discovery
#   dependabot  dependabot.yml: merge non-major Dependabot PRs, update behind bot PRs
#
# Caller shape:
#
#   permissions:
#     contents: read
#     checks: write
#     packages: write
#     pull-requests: read
#   jobs:
#     pipeline:                 # keep the id: the required check is `pipeline / build`
#       uses: ccswe-apps/actions/.github/workflows/dotnet-build-library.yml@master
#       with:
#         discover-dependents: |       # accounts to scan (trusted only; the App is public)
#           <owner>
#         dispatch: opt-in              # optional: default `all`
#       secrets:
#         NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}   # optional: publish to nuget.org
#         AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
#         AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
#
# Library-repo contract: `path` (default the repo root) holds one solution with the
# *.UnitTests.csproj / *.IntegrationTests.csproj projects; IsPackable projects
# reference the Nerdbank.GitVersioning package so packages carry the nbgv
# version. A discovered dependent is a non-archived, non-template repo in a
# listed account whose workflow takes `repository_dispatch: update-dependencies`
# and calls dotnet-update-dependencies.yml; dependents receive client_payload
# {source, version, packages}. Scanned repo names appear in the caller's run logs.

on:
  workflow_call:
    inputs:
      dependents:
        description: Repos (owner/name, one per line) to send update-dependencies after publishing.
        type: string
        default: ''
      discover-dependents:
        description: Accounts (one per line) to scan for update-dependencies listeners; only accounts you trust.
        type: string
        default: ''
      dispatch:
        description: "`all` discovered listeners, or `opt-in`: those named by the PR body's `Update-Dependents:` lines."
        type: string
        default: all
      path:
        description: Directory holding the solution.
        type: string
        default: .
      validate-packages:
        description: Run dotnet-validate (from the repo's tool manifest) on every package.
        type: boolean
        default: false
      dotnet-version:
        type: string
        default: '10.0.x'
    secrets:
      NUGET_API_KEY:
        description: nuget.org API key; when set, packages go to nuget.org instead of GitHub Packages.
        required: false
      AUTOMATION_APP_ID:
        required: true
      AUTOMATION_APP_KEY:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: read
    outputs:
      package-version: ${{ steps.build.outputs.package-version }}
      packages: ${{ steps.pack.outputs.packages }}
      publish: ${{ steps.publish.outputs.publish }}
      only: ${{ steps.opt-in.outputs.only }}
      owners: ${{ steps.plan.outputs.owners }}
    steps:
      - name: Check dispatch
        if: inputs.dispatch != 'all' && inputs.dispatch != 'opt-in'
        env:
          DISPATCH: ${{ inputs.dispatch }}
        run: |
          echo "::error::dispatch must be all or opt-in, got: $DISPATCH"
          exit 1

      # No repo code needed: before checkout.
      - id: opt-in
        if: inputs.dispatch == 'opt-in' && (inputs.dependents != '' || inputs.discover-dependents != '')
        uses: $/.github/actions/dependents-opt-in

      - id: plan
        if: inputs.dependents != '' || inputs.discover-dependents != ''
        uses: $/.github/actions/dependents-plan
        with:
          dependents: ${{ inputs.dependents }}
          discover-dependents: ${{ inputs.discover-dependents }}
          only: ${{ inputs.dispatch == 'all' && '*' || steps.opt-in.outputs.only }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: build
        uses: $/.github/actions/dotnet-build
        with:
          path: ${{ inputs.path }}
          test-patterns: '*.UnitTests.csproj *.IntegrationTests.csproj'
          dotnet-version: ${{ inputs.dotnet-version }}

      - id: pack
        uses: $/.github/actions/dotnet-pack
        with:
          path: ${{ inputs.path }}
          version: ${{ steps.build.outputs.package-version }}

      # Source Link, determinism and compiler flags; the tool version comes from the repo's manifest.
      - name: Validate packages
        if: inputs.validate-packages
        env:
          DIRECTORY: ${{ steps.pack.outputs.directory }}
        run: |
          dotnet tool restore
          for package in "$DIRECTORY"/*.nupkg; do
            dotnet tool run dotnet-validate -- package local "$package"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ${{ steps.pack.outputs.directory }}/*.nupkg
            ${{ steps.pack.outputs.directory }}/*.snupkg

      - id: packable
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: $/.github/actions/version-changed
        with:
          # Test projects under src/ (*.UnitTests, *.IntegrationTests) are excluded; a package
          # version bump in Directory.Packages.props still publishes, even if only tests use it.
          files: >-
            src Directory.Build.props Directory.Packages.props version.json global.json
            :(exclude,glob)src/**/*.UnitTests/** :(exclude,glob)src/**/*.IntegrationTests/**

      # Docs- and test-only merges don't publish, so they don't fan out to dependents.
      - id: publish
        env:
          CHANGED: ${{ steps.packable.outputs.changed }}
        run: |
          if [ "$CHANGED" = true ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      indexed: ${{ steps.wait.outputs.indexed }}
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: nupkg

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # nuget.org with NUGET_API_KEY, else GitHub Packages with GITHUB_TOKEN. A matching
      # .snupkg is pushed with each .nupkg where the feed accepts symbols.
      - name: Push
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            source=https://api.nuget.org/v3/index.json
            key="$NUGET_API_KEY"
          else
            source="https://nuget.pkg.github.com/${OWNER}/index.json"
            key="$GITHUB_TOKEN"
            dotnet nuget add source --name github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" \
              --store-password-in-clear-text "$source"
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          dotnet nuget push "nupkg/*.nupkg" --source "$source" --api-key "$key" --skip-duplicate

      # Dependents restore the exact version, so wait until the feed's flat container lists it.
      - id: wait
        uses: $/.github/actions/nuget-wait
        with:
          source: ${{ steps.push.outputs.source }}
          packages: ${{ needs.build.outputs.packages }}
          version: ${{ needs.build.outputs.package-version }}
          username: ${{ secrets.NUGET_API_KEY == '' && github.actor || '' }}
          password: ${{ secrets.NUGET_API_KEY == '' && github.token || '' }}

  # Runs on every build (PRs log the discovered set); sends only once the feed serves the publish.
  dependents:
    needs: [build, publish]
    if: >-
      always() && needs.build.result == 'success' && (inputs.dependents != '' || inputs.discover-dependents != '') &&
      (inputs.dispatch == 'all' || inputs.dependents != '' || needs.build.outputs.only != '' || github.event_name == 'pull_request')
    permissions:
      contents: read
    uses: $/.github/workflows/dispatch-dependents.yml
    with:
      owners: ${{ needs.build.outputs.owners }}
      updater: ccswe-apps/actions/.github/workflows/dotnet-update-dependencies.yml
      version: ${{ needs.build.outputs.package-version }}
      packages: ${{ needs.build.outputs.packages }}
      only: ${{ inputs.dispatch == 'all' && '*' || needs.build.outputs.only }}
      send: ${{ needs.publish.result == 'success' && needs.publish.outputs.indexed == 'true' }}
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}

  dependabot:
    needs: build
    uses: $/.github/workflows/dependabot.yml
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
