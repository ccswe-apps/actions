name: android-build-library

# Reusable workflow for Android library repos published to GitHub Packages (Maven).
#
#   build       gradle-build with `tasks`. On a default-branch push where `version-files`
#               changed, `publish` runs in the same Gradle invocation (no second compile) with
#               GITHUB_TOKEN
#   dependabot  merge / update-behind (dependabot.yml)
#
# Caller shape:
#
#   permissions:
#     contents: read
#     packages: write
#     pull-requests: read
#   jobs:
#     pipeline:                 # keep the id: the required check is `pipeline / build`
#       uses: ccswe-apps/actions/.github/workflows/android-build-library.yml@master
#       with:
#         tasks: assembleRelease test lintRelease
#         version-files: buildSrc/src/main/kotlin/_Versions_.kt
#       secrets:
#         AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
#         AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
#
# Library-repo contract: gradlew at the root; the Maven publication targets
# maven.pkg.github.com/<owner>/<repo> with credentials from the GITHUB_USER /
# GITHUB_TOKEN env vars.

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '21'
      tasks:
        description: Gradle tasks for build (build, test, lint, coverage).
        type: string
        required: true
      gradle-properties:
        description: Lines appended to ~/.gradle/gradle.properties (CI tuning).
        type: string
        default: ''
      coverage-path:
        description: Coverage report path uploaded as `coverage-report`; empty skips it.
        type: string
        default: ''
      version-files:
        description: Space-separated files whose change on a default-branch push publishes.
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 45
    secrets:
      AUTOMATION_APP_ID:
        required: true
      AUTOMATION_APP_KEY:
        required: true

jobs:
  # No `name:`, so the check is `<caller job> / build`.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # packages: write is for publish; the token stays out of .git/config (persist-credentials)
    # and reaches Gradle only on a publishing run.
    permissions:
      contents: read
      packages: write
    outputs:
      publish: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: version
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: $/.github/actions/version-changed
        with:
          files: ${{ inputs.version-files }}

      - uses: $/.github/actions/gradle-build
        env:
          GITHUB_USER: ${{ steps.version.outputs.changed == 'true' && github.actor || '' }}
          GITHUB_TOKEN: ${{ steps.version.outputs.changed == 'true' && github.token || '' }}
        with:
          java-version: ${{ inputs.java-version }}
          tasks: ${{ inputs.tasks }}${{ steps.version.outputs.changed == 'true' && ' publish' || '' }}
          gradle-properties: ${{ inputs.gradle-properties }}
          coverage-path: ${{ inputs.coverage-path }}

  dependabot:
    needs: build
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/dependabot.yml
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
