name: discover-dependents
description: List an account's repos whose update-dependencies listener calls a given updater workflow.

# Composite action used by dotnet-build-library.yml (from this repo:
# `uses: $/.github/actions/discover-dependents`). GH_TOKEN must be an
# installation token for `owner` (create-github-app-token with `owner` and no
# `repositories`); the scan reads that installation's repos and their
# .github/workflows files. Pass only owners you trust: the App is public.

inputs:
  owner:
    description: Account (org or user) to scan.
    required: true
  updater:
    description: Reusable workflow path a listener must call (without @ref).
    required: true
  exclude:
    description: Repo (owner/name) to skip, normally the library itself.
    required: false
    default: ''
  token:
    description: Installation token for `owner`.
    required: true

outputs:
  repos:
    description: JSON array of owner/name.
    value: ${{ steps.discover.outputs.repos }}

runs:
  using: composite
  steps:
    - id: discover
      shell: bash
      env:
        OWNER: ${{ inputs.owner }}
        UPDATER: ${{ inputs.updater }}
        EXCLUDE: ${{ inputs.exclude }}
        GH_TOKEN: ${{ inputs.token }}
      run: python3 "$GITHUB_ACTION_PATH/discover-dependents.py"
