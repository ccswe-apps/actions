name: setup-nanoframework
description: Installs the nanoFramework build components, MSBuild (x64) and the NuGet CLI.

# Windows only. `uses: ccswe-apps/actions/.github/actions/setup-nanoframework@master` ($/... inside this repo).

runs:
  using: composite
  steps:
    - name: Setup nanoFramework build components
      uses: nanoframework/nanobuild@v1
      with:
        gitHubAuth: ${{ github.token }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Setup NuGet
      uses: nuget/setup-nuget@v4
      with:
        nuget-version: '7.x'
