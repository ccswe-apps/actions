name: npm-build
description: npm ci, then the format:check, lint, test (when present) and build scripts.

#   - uses: ccswe-apps/actions/.github/actions/npm-build@v1   # $/... inside this repo
#     with:
#       build-env: |                 # optional: exported for `npm run build`
#         SITE=https://staging.example.com
#       committed-output: dist       # optional: fail unless the build leaves this path unchanged;
#                                    # when it doesn't, upload the built path as artifact `artifact-name`
#
# Package contract: scripts `format:check`, `lint` and `build`; `test` is optional.

inputs:
  working-directory:
    description: Directory holding package.json.
    default: .
  node-version-file:
    description: Node version file, relative to working-directory.
    default: .nvmrc
  build-env:
    description: KEY=value lines exported for `npm run build`.
    default: ''
  committed-output:
    description: Committed build output path, relative to working-directory; empty skips the check.
    default: ''
  artifact-name:
    description: Artifact holding the expected committed output when the check fails.
    default: committed-output

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.working-directory }}/${{ inputs.node-version-file }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - id: build
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        BUILD_ENV: ${{ inputs.build-env }}
        COMMITTED_OUTPUT: ${{ inputs.committed-output }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: '"$GITHUB_ACTION_PATH/npm-build.sh"'

    # Fork PRs can't get a rebuild pushed to them; the contributor downloads this and commits it.
    - if: failure() && steps.build.outputs.stale == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/${{ inputs.committed-output }}
        include-hidden-files: true
        overwrite: true
        retention-days: 7
