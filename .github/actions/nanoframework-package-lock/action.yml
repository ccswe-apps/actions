name: nanoframework-package-lock
description: Fail unless every .nfproj in the solution has a packages.lock.json.

#   - uses: ccswe-apps/actions/.github/actions/nanoframework-package-lock@master   # $/... inside this repo
#     with:
#       solution: My.sln

inputs:
  solution:
    description: Path to the solution file (backslashes allowed).
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SOLUTION: ${{ inputs.solution }}
      run: '"$GITHUB_ACTION_PATH/package-lock.sh"'
