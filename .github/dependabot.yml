version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /test/fixtures/dotnet/fail/src
      - /test/fixtures/dotnet/library/src
      - /test/fixtures/dotnet/no-tests/src
      - /test/fixtures/dotnet/pass/src
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Boise
    cooldown:
      default-days: 3
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
      nuget-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/build-nanoframework
      - /.github/actions/dotnet-build
      - /.github/actions/gradle-build
      - /.github/actions/setup-nanoframework
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Boise
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  - package-ecosystem: gradle
    directories:
      - /test/fixtures/gradle
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Boise
    cooldown:
      default-days: 3
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
      gradle-major:
        update-types: [major]
